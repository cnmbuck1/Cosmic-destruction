name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CosmicDestruction.xcodeproj \
            -scheme CosmicDestruction \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Smoke test (launch, auto-fire, screenshots)
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/CosmicDestruction.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction -SmokeTestLevel 1 -SmokeTestAutoFire
          sleep 4;  xcrun simctl io "$UDID" screenshot screenshots/1-level-loaded.png
          sleep 1;  xcrun simctl io "$UDID" screenshot screenshots/2-impact.png
          sleep 5;  xcrun simctl io "$UDID" screenshot screenshots/3-after-shot.png
          # Fail if the app crashed.
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q cosmic-destruction; then
            echo "App is not running: it crashed during the smoke test"; exit 1
          fi
          xcrun simctl terminate "$UDID" com.cnmbuckstudios.cosmic-destruction || true
          sleep 2
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction -SmokeTestLevel 3 -SmokeTestAutoFire
          sleep 4;  xcrun simctl io "$UDID" screenshot screenshots/4-level3-loaded.png
          sleep 1;  xcrun simctl io "$UDID" screenshot screenshots/5-level3-impact.png
          sleep 5;  xcrun simctl io "$UDID" screenshot screenshots/6-level3-after-shot.png
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q cosmic-destruction; then
            echo "App is not running: it crashed on level 3"; exit 1
          fi
          xcrun simctl terminate "$UDID" com.cnmbuckstudios.cosmic-destruction || true
          sleep 2
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction
          sleep 4;  xcrun simctl io "$UDID" screenshot screenshots/0-main-menu.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshots/
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots from run ${{ github.run_id }} (commit ${{ github.sha }})" > README.md
          git add -A && git commit -q -m "Smoke-test screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
