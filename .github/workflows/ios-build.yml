name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CosmicDestruction.xcodeproj \
            -scheme CosmicDestruction \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Smoke test (launch, auto-fire, screenshots)
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/CosmicDestruction.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          # Level 1 (build 3.0): direct center hit on the gate, then the left pylon,
          # then a glancing hit on the right pylon's outer edge. The app logs
          # progress / void / score after each shot to Documents/smoke-results.txt.
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction -SmokeTestLevel 1 \
            -SmokeTestTargets "0,1.0,-3.0;-2.3,1.0,-3.0;2.75,1.6,-3.0"
          # Capture launchctl output first: piping straight into `grep -q` lets grep
          # exit early, launchctl dies of SIGPIPE, and pipefail reports a false crash.
          app_running() { local jobs; jobs=$(xcrun simctl spawn "$UDID" launchctl list); grep -q cosmic-destruction <<<"$jobs"; }
          # A frame every ~0.7 s through both shots, so the impacts are captured.
          for i in $(seq -w 1 16); do
            xcrun simctl io "$UDID" screenshot "screenshots/1-level1-$i.png" >/dev/null 2>&1 || true
            sleep 0.4
          done
          sleep 8; xcrun simctl io "$UDID" screenshot screenshots/2-level1-end.png
          if ! app_running; then
            echo "App is not running: it crashed during the level 1 smoke test"; exit 1
          fi
          DATA=$(xcrun simctl get_app_container "$UDID" com.cnmbuckstudios.cosmic-destruction data)
          echo "---- Level 1 smoke results ----"
          cat "$DATA/Documents/smoke-results.txt" | tee screenshots/level1-results.txt || echo "(no results file)"
          xcrun simctl terminate "$UDID" com.cnmbuckstudios.cosmic-destruction || true
          sleep 2
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction -SmokeTestLevel 20 -SmokeTestAutoFire
          sleep 4;  xcrun simctl io "$UDID" screenshot screenshots/5-level20-loaded.png
          sleep 6;  xcrun simctl io "$UDID" screenshot screenshots/6-level20-after-shot.png
          if ! app_running; then
            echo "App is not running: it crashed on level 20"; exit 1
          fi
          xcrun simctl terminate "$UDID" com.cnmbuckstudios.cosmic-destruction || true
          sleep 2
          xcrun simctl launch "$UDID" com.cnmbuckstudios.cosmic-destruction
          sleep 4;  xcrun simctl io "$UDID" screenshot screenshots/0-main-menu.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshots/
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots from run ${{ github.run_id }} (commit ${{ github.sha }})" > README.md
          git add -A && git commit -q -m "Smoke-test screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
