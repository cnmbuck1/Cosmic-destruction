<style>

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--ink);
  font-family: var(--display); touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--display); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

#hud {

  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; max-width: 560px; margin: 0 auto;
}
.hud-row { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: var(--panel); border: 1px solid rgba(51, 235, 255, 0.5); color: var(--cyan);
  display: grid; place-items: center; padding: 0;
}
.lvl { display: grid; min-width: 0; flex: 1; }
.lvl small { font-size: 11px; letter-spacing: 0.24em; color: var(--cyan); font-weight: 700; }
.lvl strong { font-size: 16px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shots {

  background: var(--panel); border: 1px solid rgba(51, 235, 255, 0.4);
}
.shot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(51, 235, 255, 0.35); background: rgba(255,255,255,0.1); transform: scale(0.8); transition: all .3s; }
.shot.on { background: radial-gradient(circle, #fff, var(--cyan)); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); transform: none; }
.bar { background: var(--panel); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
.bar-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.2em; color: var(--dim); }
.bar-head b { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-size: 11px; color: var(--ink); }
.bar-head b.met { color: var(--cyan); }
.track { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }

.panel {

.card .t b { letter-spacing: .1em; font-size: 15px; }

.orb {

@keyframes pulse { 50% { transform: scale(1.08); } }

.foot { font-size: 11px; color: var(--dim); letter-spacing: .06em; max-width: 32ch; line-height: 1.5; }
.toggles { display: flex; gap: 10px; }
.chip { background: transparent; border: 1px solid rgba(51,235,255,.5); color: var(--cyan); border-radius: 12px; padding: 8px 14px; font-size: 12px; letter-spacing: .12em; }
.chip[aria-pressed="false"] { color: var(--dim); border-color: rgba(255,255,255,.2); }
#err { position: fixed; inset: auto 16px 16px; z-index: 20; color: var(--magenta); font-family: var(--mono); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .panel, .orb::before, .orb::after { animation: none; } .star { transition: none; } }

<script>
(() => {

  return;
}
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function seeded(seed) {

// ---------- Rules & tuning (mirrors Core/GameConfig.swift) ----------
const RULES = {
  removalY: -1.6, half: 12.5, fadeY: -5, cleanupY: -18, orbLife: 7, maxOrbs: 3,
  minResolve: 1, maxResolve: 4.5, failDelay: 1, slowScale: 0.3, slowDur: 0.4, slowFrac: 0.35,
  displaced: 0.6, yawLim: 32, minEl: -4, maxEl: 40, defEl: 8, sens: 0.22, cannonZ: 5.9,
};

  orbMass: 9, orbR: 0.38, launch: 21, blockMass: 1, heavyMul: 3.5,
  stab: 0.92, linDamp: 0.06, angDamp: 0.1, settle: 0.35, hfov: 50,
};

// ---------- Levels (mirrors Core/Levels.swift) ----------
const LEVELS = (() => {
  const gap = 0.004, cube = 0.9, step = cube + gap, C = [cube, cube, cube];
  const L1 = [];
  for (let layer = 0; layer < 5; layer++) {
    const y = gap + cube / 2 + layer * step;
    for (const x of [-0.455, 0.455]) for (const z of [-0.455, 0.455])
      L1.push({ c: [x, y, z], s: C, k: layer === 2 ? "energy" : "standard", t: true });
  }
  const L2 = [];
  for (const tx of [-1.8, 1.8]) for (let layer = 0; layer < 3; layer++) {
    const y = gap + cube / 2 + layer * step;
    for (const dx of [-0.455, 0.455]) for (const z of [-0.455, 0.455])
      L2.push({ c: [tx + dx, y, z], s: C, k: layer === 0 ? "heavy" : "standard", t: true });
  }

  for (const z of [-0.455, 0.455]) L2.push({ c: [0, top2 + gap + beam2[1] / 2, z], s: beam2, k: "heavy", t: true });
  const topY = top2 + gap + beam2[1] + gap + cube / 2;
  for (const x of [-1.365, -0.455, 0.455, 1.365]) L2.push({ c: [x, topY, 0], s: C, k: "energy", t: true });

  const L3 = [], slab = [1.0, 0.5, 1.0];
  for (let i = 0; i < 6; i++) for (const z of [-0.505, 0.505])
    L3.push({ c: [(i - 2.5) * 1.01, gap + slab[1] / 2, z], s: slab, k: "heavy", t: false });
  const fTop = gap + slab[1];
  for (const x of [-2.5, 2.5]) for (const z of [-0.5, 0.5]) for (let l = 0; l < 3; l++)
    L3.push({ c: [x, fTop + gap + cube / 2 + l * step, z], s: C, k: "standard", t: true });
  for (const x of [-1, 1]) for (let l = 0; l < 3; l++)
    L3.push({ c: [x, fTop + gap + cube / 2 + l * step, 0], s: C, k: "standard", t: true });
  const colTop = fTop + 3 * step, beam3 = [6.0, 0.45, cube];
  for (const z of [-0.5, 0.5]) L3.push({ c: [0, colTop + gap + beam3[1] / 2, z], s: beam3, k: "heavy", t: true });
  const deck = colTop + gap + beam3[1];
  for (let l = 0; l < 2; l++) for (const x of [-0.455, 0.455]) for (const z of [-0.455, 0.455])
    L3.push({ c: [x, deck + gap + cube / 2 + l * step, z], s: C, k: "energy", t: true });

  return [
    { id: 1, name: "First Impact", diff: "Easy", gravity: -13, shots: 3, threshold: 0.8, origin: [0, 0, -4.0], blocks: L1 },
    { id: 2, name: "Twin Towers", diff: "Moderate", gravity: -13, shots: 3, threshold: 0.8, origin: [0, 0, -4.0], blocks: L2 },
    { id: 3, name: "Lunar Fortress", diff: "Challenging", gravity: -10, shots: 3, threshold: 0.8, origin: [0, 0, -4.2], blocks: L3 },

})();
const starsFor = (shots) => (shots <= 1 ? 3 : shots <= 2 ? 2 : 1);

// ---------- Progress (per-browser convenience only) ----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem("cd.progress") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("cd.progress", JSON.stringify(v)); } catch {} },
};
let progress = Object.assign({ unlocked: 0, stars: {}, sound: true }, store.get());

// ---------- Procedural textures ----------
function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function spaceTexture() {
  const [c, g] = canvas(2048, 1024), r = seeded(7);
  const base = g.createLinearGradient(0, 0, 0, 1024);
  base.addColorStop(0, "#010205"); base.addColorStop(0.55, "#050818"); base.addColorStop(1, "#010205");
  g.fillStyle = base; g.fillRect(0, 0, 2048, 1024);
  const neb = ["89,26,153", "13,89,140", "140,20,102"];
  for (let i = 0; i < 34; i++) {
    const x = rnd(r, 200, 1850), y = rnd(r, 280, 620), rad = rnd(r, 90, 300), a = rnd(r, 0.05, 0.13);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${neb[i % 3]},${a})`); gr.addColorStop(1, `rgba(${neb[i % 3]},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 2600; i++) {
    const b = Math.round(rnd(r, 70, 230)), s = rnd(r, 0.6, 1.6);
    g.fillStyle = `rgb(${b},${Math.round(b * 0.95)},${b})`; g.fillRect(rnd(r, 0, 2048), rnd(r, 0, 1024), s, s);
  }
  for (let i = 0; i < 70; i++) {
    const x = rnd(r, 0, 2048), y = rnd(r, 0, 1024), rad = rnd(r, 2.5, 6);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, "rgba(217,242,255,.9)"); gr.addColorStop(1, "rgba(128,204,255,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // Distant ringed planet painted into the backdrop.
  const px = 760, py = 330, pr = 70;
  const pg = g.createRadialGradient(px - 20, py - 25, 5, px, py, pr);
  pg.addColorStop(0, "#5a3a8a"); pg.addColorStop(1, "#1a0f33");
  g.fillStyle = pg; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(158,77,255,.55)"; g.lineWidth = 8;
  g.beginPath(); g.ellipse(px, py, 125, 26, -0.35, 0, Math.PI * 2); g.stroke();
  return c;
}
function lunarTextures() {
  const [d, gd] = canvas(1024, 1024), r = seeded(21);
  gd.fillStyle = "#17181f"; gd.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 5000; i++) {
    const light = r() > 0.5, s = rnd(r, 1, 9);
    gd.fillStyle = light ? `rgba(77,77,77,${rnd(r, .03, .08)})` : `rgba(0,0,0,${rnd(r, .05, .12)})`;
    gd.beginPath(); gd.arc(rnd(r, 0, 1024), rnd(r, 0, 1024), s / 2, 0, 7); gd.fill();
  }
  for (let i = 0; i < 26; i++) {
    const s = rnd(r, 12, 60), x = rnd(r, 0, 1024), y = rnd(r, 0, 1024);
    gd.fillStyle = "rgba(0,0,0,.22)"; gd.beginPath(); gd.arc(x, y, s / 2, 0, 7); gd.fill();
    gd.strokeStyle = "rgba(115,115,115,.12)"; gd.lineWidth = 2; gd.stroke();
  }
  const [e, ge] = canvas(1024, 1024), r2 = seeded(33);
  ge.fillStyle = "#000"; ge.fillRect(0, 0, 1024, 1024);
  ge.strokeStyle = "rgba(26,140,191,.35)"; ge.lineWidth = 2;
  for (let rad = 120; rad <= 480; rad += 120) { ge.beginPath(); ge.arc(512, 512, rad, 0, 7); ge.stroke(); }
  ge.strokeStyle = "rgba(89,38,153,.22)"; ge.lineWidth = 1.5;
  const hex = 64; let row = 0;
  for (let y = 0; y <= 1024; y += hex * 0.866, row++) {
    for (let x = row % 2 ? hex / 2 : 0; x <= 1024; x += hex) {
      ge.beginPath();
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; ge[k ? "lineTo" : "moveTo"](x + Math.cos(a) * hex / 2, y + Math.sin(a) * hex / 2); }

  for (let i = 0; i < 16; i++) {
    const col = i % 2 ? "166,77,255" : "51,230,255";
    let x = rnd(r2, 0, 1024), y = rnd(r2, 0, 1024), a = rnd(r2, 0, 6.28);
    const pts = [[x, y]];
    const n = Math.floor(rnd(r2, 6, 16));
    for (let j = 0; j < n; j++) { a += rnd(r2, -0.7, 0.7); const l = rnd(r2, 10, 34); x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]); }

      ge.strokeStyle = `rgba(${col},${al})`; ge.lineWidth = w; ge.beginPath();

  }

}
function panelTexture(base, edge, seam, seed) {
  const [c, g] = canvas(256, 256), r = seeded(seed);
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 700; i++) { g.fillStyle = r() > 0.5 ? `rgba(255,255,255,${rnd(r, .02, .06)})` : `rgba(0,0,0,${rnd(r, .02, .06)})`; const s = rnd(r, 1, 4); g.fillRect(rnd(r, 0, 256), rnd(r, 0, 256), s, s); }
  g.strokeStyle = edge; g.lineWidth = 10; g.strokeRect(5, 5, 246, 246);
  g.strokeStyle = seam; g.lineWidth = 3; g.strokeRect(34, 34, 188, 188);

}
function emissionTexture(color, strong) {

  if (strong) { g.lineWidth = 5; g.beginPath(); g.arc(128, 128, 40, 0, 7); g.stroke(); g.fillStyle = color; g.beginPath(); g.arc(128, 128, 12, 0, 7); g.fill(); }

}
function glowTexture() {
  const [c, g] = canvas(128, 128);

    buffers.victory = render(1.1, (t) => { let o = 0; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { const lt = t - i * 0.11; if (lt >= 0) o += Math.exp(-lt * (i === 3 ? 2.5 : 9)) * (sine(lt * f) + 0.3 * sine(lt * f * 2)); }); return 0.22 * o; });
    buffers.failure = render(1.0, (t) => { let o = 0; [392, 329.63, 261.63].forEach((f, i) => { const lt = t - i * 0.18; if (lt >= 0) o += Math.exp(-lt * 4) * sine(lt * f); }); return 0.2 * o; });
    buffers.menu = render(0.07, (t) => 0.25 * sine(t * 1250) * Math.exp(-t * 60));
    buffers.ambience = render(6, (t) => 0.12 * (0.5 * sine(t * 55) + 0.3 * sine(t * 82.5) * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / 6)) + 0.06 * sine(t * 220) * (0.5 + 0.5 * Math.sin(2 * Math.PI * 2 * t / 6 + 1))));
  }
  function startAmbience() {
    if (!ctx || ambient || !progress.sound) return;
    ambient = ctx.createBufferSource(); ambient.buffer = buffers.ambience; ambient.loop = true;
    const g = ctx.createGain(); g.gain.value = 0.35; ambient.connect(g).connect(ctx.destination); ambient.start();
  }
  return {
    unlock() {
      if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); build(); startAmbience(); } catch { ctx = null; }
    },
    play(name, vol = 1, minGap = 0) {
      if (!ctx || !progress.sound || !buffers[name]) return;
      const now = performance.now() / 1000;
      if (minGap && last[name] && now - last[name] < minGap) return;
      last[name] = now;
      const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buffers[name]; g.gain.value = clamp(vol, 0, 1);
      s.connect(g).connect(ctx.destination); s.start();
    },
    setSound(on) { progress.sound = on; store.set(progress); if (!on && ambient) { ambient.stop(); ambient = null; } else startAmbience(); },
  };
})();
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---------- Orbs ----------
const orbVisual = (() => {
  const shellMat = std({ color: 0x8cd9ff, metalness: 0.2, roughness: 0.06, transparent: true, opacity: 0.5, emissiveMap: tex(orbBands()), emissive: 0xffffff, emissiveIntensity: 1.2 });
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xe8fbff });
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x33ebff });
  return (r) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r * 0.5, 24, 12), coreMat));
    const shell = new THREE.Mesh(new THREE.SphereGeometry(r, 36, 18), shellMat); g.add(shell);
    const rings = [0.5, -0.9].map((tilt) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r * 0.74, r * 0.035, 6, 36), ringMat); m.rotation.set(tilt, 0, tilt * 0.5); g.add(m); return m; });
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x8cd9ff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    halo.scale.setScalar(r * 4.2); g.add(halo);
    const light = new THREE.PointLight(0x33ebff, 1.2, 4); g.add(light);
    g.userData.spin = (dt) => { shell.rotation.y += dt * 2.5; rings[0].rotation.y += dt * 3; rings[1].rotation.y -= dt * 4.2; };
    return g;
  };
})();
const trailSprites = Array.from({ length: 18 }, () => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x33ebff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 })); scene.add(s); return s; });
let orbs = [];

// ---------- Game state ----------
let blocks = [], level = null, levelIndex = 0, phase = "menu";
let shotsUsed = 0, shotStart = 0, failAt = 0, simTime = 0, stabilized = true;
let currentOrb = null, displacedThisShot = 0, collapsedThisShot = false, paused = false, token = 0;
const contacts = [];
const boxGeoCache = {};

function clearLevel() {
  for (const b of blocks) { scene.remove(b.mesh); world.removeBody(b.body); }
  for (const o of orbs) { scene.remove(o.mesh); world.removeBody(o.body); }
  blocks = []; orbs = []; contacts.length = 0; currentOrb = null;
  trailSprites.forEach((s) => (s.material.opacity = 0));
}
function loadLevel(i) {
  levelIndex = i; level = LEVELS[i]; token++;
  clearLevel(); fx.reset();
  world.gravity.set(0, level.gravity, 0);
  const [ox, oy, oz] = level.origin;
  for (const spec of level.blocks) {
    const [w, h, d] = spec.s, key = spec.s.join("x");
    const geo = boxGeoCache[key] || (boxGeoCache[key] = new THREE.BoxGeometry(w, h, d));
    const mesh = new THREE.Mesh(geo, blockMaterial(spec.k, spec.t));
    mesh.castShadow = mesh.receiveShadow = true;
    const vol = (w * h * d) / 0.729, mass = TUNE.blockMass * (spec.k === "heavy" ? TUNE.heavyMul : 1) * Math.max(0.5, vol);
    const body = new CANNON.Body({ mass, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) });
    body.position.set(ox + spec.c[0], oy + spec.c[1], oz + spec.c[2]);
    body.linearDamping = body.angularDamping = TUNE.stab;
    body.sleepSpeedLimit = 0.08; body.sleepTimeLimit = 0.6;
    const b = { mesh, body, spec, start: body.position.clone(), removed: false, displaced: false, gone: false };
    body.addEventListener("collide", (e) => {
      const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
      if (v > 1.2) contacts.push({ kind: "block", v, at: e.contact.bi.position.vadd(e.contact.ri) });
    });
    world.addBody(body); scene.add(mesh); blocks.push(b);
  }
  stabilized = true;
  shotsUsed = 0; simTime = 0; displacedThisShot = 0; collapsedThisShot = false; paused = false;
  cannon.reset(); phase = "aiming"; aiming = false;
  showHUD(true); renderHUD(); updateTrajectory(0.35); hideOverlay();
}
const targetCount = () => blocks.filter((b) => b.spec.t).length;
const removedCount = () => blocks.filter((b) => b.spec.t && b.removed).length;
const progressFrac = () => (targetCount() ? removedCount() / targetCount() : 0);
const canFire = () => phase === "aiming" && !paused && shotsUsed < level.shots;

function updateTrajectory(emphasis) {
  if (!level || !canFire()) { traj.hide(); return; }
  traj.update(cannon.muzzle(), cannon.dir().multiplyScalar(TUNE.launch), level.gravity, emphasis);
}

function fire() {
  if (!canFire()) return;
  shotsUsed++; shotStart = simTime; phase = "resolving";
  if (stabilized) { for (const b of blocks) { b.body.linearDamping = TUNE.linDamp; b.body.angularDamping = TUNE.angDamp; b.body.wakeUp(); } stabilized = false; }
  while (orbs.length >= RULES.maxOrbs) removeOrb(orbs[0]);
  const origin = cannon.muzzle(), dir = cannon.dir();
  const mesh = orbVisual(TUNE.orbR); mesh.position.copy(origin); scene.add(mesh);
  const body = new CANNON.Body({ mass: TUNE.orbMass, shape: new CANNON.Sphere(TUNE.orbR) });
  body.position.set(origin.x, origin.y, origin.z);
  body.velocity.set(dir.x * TUNE.launch, dir.y * TUNE.launch, dir.z * TUNE.launch);
  body.linearDamping = 0.02; body.angularDamping = 0.3; body.allowSleep = false;
  const orb = { mesh, body, born: simTime, hits: 0, history: [] };
  body.addEventListener("collide", (e) => {
    const other = e.body, v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    contacts.push({ kind: other.mass > 0 ? "orb-block" : "orb-ground", orb, v, mass: other.mass, at: e.contact.bi.position.vadd(e.contact.ri) });
  });
  world.addBody(body); orbs.push(orb); currentOrb = orb;
  cannon.fire(); fx.muzzle(origin); fx.shake(0.05, 0.18);
  audio.play("launch"); buzz(15);
  traj.hide(); displacedThisShot = 0; collapsedThisShot = false;
  $("hint").hidden = true; renderHUD();
}
function removeOrb(o) { scene.remove(o.mesh); world.removeBody(o.body); orbs = orbs.filter((x) => x !== o); }

function processContacts() {
  for (const c of contacts.splice(0)) {
    const at = new THREE.Vector3(c.at.x, c.at.y, c.at.z);
    if (c.kind === "orb-block") {
      const first = c.orb.hits === 0, impulse = c.v * Math.min(TUNE.orbMass, c.mass);
      if (!first && impulse < 6) continue;
      c.orb.hits++;
      const k = Math.max(clamp(impulse / 40, 0, 1), first ? 0.6 : 0);
      fx.impact(at, k); audio.play("impact", 0.4 + 0.6 * k, 0.08);
      if (first) fx.shake(0.06 + 0.06 * k, 0.25);
      if (k > 0.3) buzz(10);
    } else if (c.kind === "orb-ground") {
      if (c.v > 2) { fx.dust(at, 0.5, simTime); audio.play("hit", 0.35, 0.1); }
    } else if (c.v > 2) {
      const k = clamp(c.v / 8, 0, 1);
      fx.dust(at, k, simTime); audio.play("hit", 0.15 + 0.45 * k, 0.06);
    }
  }
}

function updateBlocks() {
  let changed = false;
  for (const b of blocks) {
    if (b.gone) continue;
    const p = b.body.position;
    b.mesh.position.set(p.x, p.y, p.z); b.mesh.quaternion.set(b.body.quaternion.x, b.body.quaternion.y, b.body.quaternion.z, b.body.quaternion.w);
    if (!b.displaced && p.distanceTo(b.start) > RULES.displaced) { b.displaced = true; if (b.spec.t) { displacedThisShot++; } }
    if (!b.removed && (p.y < RULES.removalY || Math.abs(p.x) > RULES.half || Math.abs(p.z) > RULES.half)) { b.removed = true; changed = true; }
    if (p.y < RULES.fadeY) {
      const t = clamp((RULES.fadeY - p.y) / (RULES.fadeY - RULES.cleanupY), 0, 1);
      if (!b.mesh.material.userData.clone) { b.mesh.material = b.mesh.material.clone(); b.mesh.material.transparent = true; b.mesh.material.userData.clone = true; }
      b.mesh.material.opacity = 1 - t; b.mesh.scale.setScalar(1 - 0.6 * t);
    }
    if (p.y < RULES.cleanupY || Math.abs(p.x) > 60 || Math.abs(p.z) > 60) { b.gone = true; scene.remove(b.mesh); world.removeBody(b.body); }
  }
  if (phase === "resolving" && !collapsedThisShot && displacedThisShot >= Math.ceil(targetCount() * RULES.slowFrac)) {
    collapsedThisShot = true; fx.slowmo(); fx.shake(0.1, 0.5); audio.play("collapse", 0.9); buzz(25);
  }
  if (changed) renderHUD();
}
function settled() {
  return blocks.every((b) => b.gone || b.removed || b.body.velocity.length() < TUNE.settle);
}
function orbResolved() {
  const o = currentOrb;
  if (!o || !orbs.includes(o)) return true;
  const p = o.body.position;
  if (p.y < RULES.removalY || Math.abs(p.x) > RULES.half || Math.abs(p.z) > RULES.half) return true;
  return simTime - o.born > 0.6 && o.body.velocity.length() < TUNE.settle * 2;
}
function updateOrbs(dt) {
  for (const o of orbs.slice()) {
    const p = o.body.position;
    o.mesh.position.set(p.x, p.y, p.z); o.mesh.userData.spin(dt);
    if (p.y < -18 || simTime - o.born > RULES.orbLife) removeOrb(o);
  }
  // Trail behind the most recent orb.
  const o = currentOrb && orbs.includes(currentOrb) ? currentOrb : null;
  if (o) { o.history.unshift(o.mesh.position.clone()); o.history.length = Math.min(o.history.length, trailSprites.length); }
  trailSprites.forEach((s, i) => {
    const h = o && o.history[i];
    if (!h || o.body.velocity.length() < 2) { s.material.opacity = Math.max(0, s.material.opacity - dt * 4); return; }
    s.position.copy(h); const k = 1 - i / trailSprites.length; s.scale.setScalar(TUNE.orbR * 1.8 * k + 0.05); s.material.opacity = 0.75 * k;
  });
}
function updateGame() {
  if (phase === "resolving") {
    const prog = progressFrac(), el = simTime - shotStart;
    const done = el >= RULES.maxResolve || (el >= RULES.minResolve && (prog >= level.threshold || (orbResolved() && settled())));
    if (!done) return;
    if (prog >= level.threshold) win();
    else if (shotsUsed >= level.shots) { phase = "failing"; failAt = simTime + RULES.failDelay; }
    else { phase = "aiming"; currentOrb = null; updateTrajectory(0.35); renderHUD(); }
  } else if (phase === "failing") {
    if (progressFrac() >= level.threshold) win();
    else if (simTime >= failAt) lose();
  }
}
function win() {
  phase = "won"; traj.hide();
  const stars = starsFor(shotsUsed);
  progress.stars[level.id] = Math.max(progress.stars[level.id] || 0, stars);
  progress.unlocked = Math.max(progress.unlocked, Math.min(levelIndex + 1, LEVELS.length - 1));
  store.set(progress);
  const t = token;
  setTimeout(() => { if (t !== token) return; audio.play("victory"); buzz([20, 40, 20]); showVictory(stars); }, 600);
}
function lose() { phase = "failed"; traj.hide(); audio.play("failure"); showFailure(progressFrac()); }

// ---------- Input ----------
let aiming = false, aimStart = null, aimYaw = 0, aimEl = 0, pointerId = null;
canvasEl.addEventListener("pointerdown", (e) => {
  audio.unlock();
  if (!level || !canFire() || pointerId !== null) return;
  pointerId = e.pointerId; canvasEl.setPointerCapture(e.pointerId);
  aiming = true; aimStart = [e.clientX, e.clientY]; aimYaw = cannon.yaw; aimEl = cannon.el;
  cannon.charge(true); audio.play("charge", 0.55); updateTrajectory(1); $("hint").hidden = true;
});
canvasEl.addEventListener("pointermove", (e) => {
  if (!aiming || e.pointerId !== pointerId) return;
  cannon.set(aimYaw + (e.clientX - aimStart[0]) * RULES.sens, aimEl - (e.clientY - aimStart[1]) * RULES.sens);
  updateTrajectory(1);
});
function endAim(e, fireIt) {
  if (!aiming || e.pointerId !== pointerId) return;
  aiming = false; pointerId = null;
  if (fireIt) fire(); else { cannon.charge(false); updateTrajectory(0.35); }
}
canvasEl.addEventListener("pointerup", (e) => endAim(e, true));
canvasEl.addEventListener("pointercancel", (e) => endAim(e, false));

// ---------- UI ----------
const overlay = $("overlay");
const STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
function hideOverlay() { overlay.innerHTML = ""; overlay.className = ""; overlay.hidden = true; }
function showOverlay(html, dim = true) { overlay.hidden = false; overlay.className = dim ? "dim" : ""; overlay.innerHTML = html; }
function on(id, fn) { const el = $(id); if (el) el.addEventListener("click", () => { audio.unlock(); audio.play("menu"); fn(); }); }
function showHUD(v) { $("hud").hidden = !v; $("hint").hidden = !(v && levelIndex === 0 && shotsUsed === 0); }
function renderHUD() {
  if (!level) return;
  $("lvlNum").textContent = `LEVEL ${levelIndex + 1}`;
  $("lvlName").textContent = level.name.toUpperCase();
  $("shots").innerHTML = Array.from({ length: level.shots }, (_, i) => `<span class="shot${i < level.shots - shotsUsed ? " on" : ""}"></span>`).join("");
  const p = progressFrac();
  $("pct").textContent = `${Math.round(p * 100)}% / ${Math.round(level.threshold * 100)}%`;
  $("pct").className = p >= level.threshold ? "met" : "";
  $("fill").style.width = `${Math.max(2, Math.min(100, p * 100))}%`;
  $("mark").style.left = `${level.threshold * 100}%`;
}
function showMenu() {
  phase = "menu"; level = null; clearLevel(); traj.hide(); showHUD(false);
  showOverlay(`<div class="panel bare">
      <div class="orb" aria-hidden="true"></div>
      <h1>COSMIC<br>DESTRUCTION</h1>
      <div class="studio">CNMBUCK STUDIOS</div>
      <div class="btns"><button class="btn" id="play">PLAY</button>
      <button class="chip" id="snd" aria-pressed="${progress.sound}">SOUND ${progress.sound ? "ON" : "OFF"}</button></div>
      <p class="foot">Web preview of the iOS prototype. Drag to aim, release to fire.</p>
    </div>`);
  on("play", showLevels);
  on("snd", () => { audio.setSound(!progress.sound); showMenu(); });
}
function showLevels() {
  phase = "menu"; showHUD(false);
  const cards = LEVELS.map((l, i) => {
    const open = i <= progress.unlocked, s = progress.stars[l.id] || 0;
    return `<button class="card" id="lv${i}" ${open ? "" : "disabled"}>
      <span class="n">${i + 1}</span>
      <span class="t"><b>${l.name.toUpperCase()}</b><span>${l.diff} · ${l.blocks.filter((b) => b.t).length} targets · ${l.shots} shots</span></span>
      <span class="s">${open ? "★".repeat(s) + "☆".repeat(3 - s) : "LOCKED"}</span></button>`;
  }).join("");
  showOverlay(`<div class="panel bare" style="width:min(380px,100%)"><h2>SELECT LEVEL</h2><div class="levels">${cards}</div><button class="link" id="back">BACK</button></div>`);
  LEVELS.forEach((_, i) => on(`lv${i}`, () => loadLevel(i)));
  on("back", showMenu);
}
function showVictory(stars) {
  const hasNext = levelIndex < LEVELS.length - 1;
  showOverlay(`<div class="panel"><h2>LEVEL COMPLETE</h2>
    <div class="stars">${[0, 1, 2].map((i) => STAR.replace('class="star"', `class="star${i < stars ? " earned" : ""}"`)).join("")}</div>
    <div class="meta">SHOTS USED: ${shotsUsed}</div>
    <div class="btns">${hasNext ? '<button class="btn" id="next">NEXT LEVEL</button>' : '<div class="note">All prototype levels cleared!</div>'}
    <button class="btn ghost" id="replay">REPLAY</button><button class="link" id="levels">LEVELS</button></div></div>`);
  overlay.querySelectorAll(".star").forEach((s, i) => setTimeout(() => s.classList.add("show"), 220 * (i + 1)));
  on("next", () => loadLevel(levelIndex + 1));
  on("replay", () => loadLevel(levelIndex));
  on("levels", showLevels);
}
function showFailure(p) {
  const gap = level.threshold - p;
  const msg = gap <= 0.1 ? "So close! One more try." : gap <= 0.3 ? "Good damage. Look for the weak point." : "Try a different angle on the supports.";
  showOverlay(`<div class="panel fail"><h2>LEVEL FAILED</h2>
    <div><div class="big">${Math.round(p * 100)}%</div><div class="small-label">TARGET DESTRUCTION (NEED ${Math.round(level.threshold * 100)}%)</div></div>
    <div class="note">${msg}</div>
    <div class="btns"><button class="btn" id="retry">RETRY</button><button class="link" id="levels">LEVELS</button></div></div>`);
  on("retry", () => loadLevel(levelIndex));
  on("levels", showLevels);
}
function showPause() {
  if (!level || phase === "won" || phase === "failed" || paused) return;
  paused = true; aiming = false; pointerId = null; cannon.charge(false);
  showOverlay(`<div class="panel"><h2>PAUSED</h2><div class="btns">
    <button class="btn" id="resume">RESUME</button><button class="btn ghost" id="restart">RESTART</button>
    <button class="link" id="levels">LEVELS</button></div>
    <div class="toggles"><button class="chip" id="snd" aria-pressed="${progress.sound}">SOUND ${progress.sound ? "ON" : "OFF"}</button></div></div>`);
  on("resume", () => { paused = false; hideOverlay(); updateTrajectory(0.35); });
  on("restart", () => loadLevel(levelIndex));
  on("levels", () => { paused = false; showLevels(); });
  on("snd", () => { audio.setSound(!progress.sound); paused = false; showPause(); });
}
$("pauseBtn").addEventListener("click", () => { audio.play("menu"); showPause(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && level && phase !== "won" && phase !== "failed") showPause(); });

// ---------- Loop ----------
let lastT = performance.now(), acc = 0;
function frame(now) {
  const raw = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!paused) {
    fx.update(raw);
    cannon.update(raw);
    if (level) {
      const ts = fx.timeScale(), dt = raw * ts;
      simTime += dt;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 8) { world.step(FIXED); acc -= FIXED; steps++; }
      if (steps === 8) acc = 0;
      processContacts(); updateBlocks(); updateOrbs(raw); updateGame();
    }
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);

// Test hook for automated checks (no effect on play).
window.__cd = { loadLevel, fire, state: () => ({ phase, shotsUsed, progress: progressFrac(), level: level && level.id, blocks: blocks.length }), aim: (y, e) => { cannon.set(y, e); updateTrajectory(1); } };
})();
</script>
