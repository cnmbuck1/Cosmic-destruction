<style>
/* Layout: one full-bleed WebGL stage; HUD pinned to the top safe area; modal panels centered. Single dark arcade look by design. */
:root {
  --void: #03050d;
  --panel: rgba(7, 11, 28, 0.86);
  --cyan: #33ebff;
  --purple: #9e4dff;
  --magenta: #ff40bf;
  --ink: #e9f6ff;
  --dim: rgba(233, 246, 255, 0.62);
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--void); color: var(--ink);
  font-family: var(--display); touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--display); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; max-width: 560px; margin: 0 auto;
}
.hud-row { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: var(--panel); border: 1px solid rgba(51, 235, 255, 0.5); color: var(--cyan);
  display: grid; place-items: center; padding: 0;
}
.lvl { display: grid; min-width: 0; flex: 1; }
.lvl small { font-size: 11px; letter-spacing: 0.24em; color: var(--cyan); font-weight: 700; }
.lvl strong { font-size: 16px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shots {
  display: flex; gap: 6px; padding: 0 12px; height: 44px; align-items: center; border-radius: 22px;
  background: var(--panel); border: 1px solid rgba(51, 235, 255, 0.4);
}
.shot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(51, 235, 255, 0.35); background: rgba(255,255,255,0.1); transform: scale(0.8); transition: all .3s; }
.shot.on { background: radial-gradient(circle, #fff, var(--cyan)); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); transform: none; }
.bar { background: var(--panel); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
.bar-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.2em; color: var(--dim); }
.bar-head b { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-size: 11px; color: var(--ink); }
#pct { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); display: inline-block; transform-origin: left center; }
#pct.met { color: var(--cyan); }
#pct.pulse { animation: pulse .45s ease-out; }
@keyframes pulse { 0% { transform: scale(1); text-shadow: none; } 30% { transform: scale(1.1); text-shadow: 0 0 10px var(--cyan); } 100% { transform: scale(1); text-shadow: none; } }
.track { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }
#fill { position: absolute; inset: 0 auto 0 0; width: 2%; border-radius: 4px; background: linear-gradient(90deg, var(--purple), var(--cyan)); box-shadow: 0 0 8px rgba(51,235,255,.6); transition: width .3s ease-out; }
#mark { position: absolute; top: -2px; width: 2px; height: 12px; background: #fff; left: 80%; }

#hint {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  font-size: 12px; letter-spacing: 0.18em; white-space: nowrap; padding: 10px 16px; border-radius: 20px;
  background: var(--panel); border: 1px solid rgba(51,235,255,.4); color: rgba(233,246,255,.88);
}

#overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
#overlay.dim { background: rgba(0, 0, 0, 0.55); }
.panel {
  width: min(340px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center;
  padding: 30px 22px; border-radius: 24px; background: var(--panel);
  border: 1.5px solid rgba(51,235,255,.6); box-shadow: 0 0 34px rgba(51,235,255,.3);
  animation: pop .35s cubic-bezier(.2,1.4,.4,1);
}
.panel.fail { border-color: rgba(158,77,255,.7); box-shadow: 0 0 34px rgba(158,77,255,.35); }
.panel.bare { background: none; border: 0; box-shadow: none; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
h1, h2 { margin: 0; font-weight: 700; text-wrap: balance; text-shadow: 0 0 14px rgba(51,235,255,.8); }
h1 { font-size: clamp(26px, 8.6vw, 46px); letter-spacing: 0.08em; line-height: 1.02; background: linear-gradient(#fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 12px rgba(51,235,255,.6)); }
h2 { font-size: 24px; letter-spacing: 0.12em; }
.studio { font-size: 13px; letter-spacing: 0.3em; color: var(--purple); text-shadow: 0 0 8px rgba(158,77,255,.7); }
.btns { display: grid; gap: 12px; width: 100%; justify-items: center; }
.btn {
  width: min(260px, 100%); padding: 15px 0; border-radius: 14px; font-size: 17px; font-weight: 700; letter-spacing: 0.2em;
  background: var(--cyan); color: #01060c; border: 1.5px solid var(--cyan); box-shadow: 0 0 14px rgba(51,235,255,.5);

}
.btn:active { transform: scale(.96); }
.btn.ghost { background: transparent; color: var(--purple); border-color: var(--purple); box-shadow: 0 0 12px rgba(158,77,255,.35); }
.link { background: none; border: 0; color: var(--dim); font-size: 13px; letter-spacing: 0.18em; padding: 8px; }
.stars { display: flex; gap: 14px; }
.star { width: 40px; height: 40px; opacity: 0; transform: scale(.2); transition: all .4s cubic-bezier(.2,1.6,.4,1); }
.star.show { opacity: 1; transform: none; }
.star path { fill: rgba(255,255,255,.18); }
.star.earned path { fill: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
.meta { font-family: var(--mono); font-size: 14px; color: var(--dim); }
.big { font-size: 46px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); line-height: 1; }
.small-label { font-size: 10px; letter-spacing: .16em; color: var(--dim); }
.note { font-size: 13px; color: rgba(233,246,255,.85); line-height: 1.45; max-width: 30ch; }
.levels { display: grid; gap: 12px; width: 100%; }
.card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; border-radius: 16px;
  background: var(--panel); border: 1px solid rgba(51,235,255,.5); color: var(--ink);
}
.card[disabled] { opacity: .5; border-color: rgba(255,255,255,.1); cursor: default; }
.card .n { font-size: 30px; font-weight: 700; color: var(--cyan); width: 36px; flex: none; }
.card .t { flex: 1; min-width: 0; display: grid; gap: 3px; }
.card .t b { letter-spacing: .1em; font-size: 15px; }
.card .t span { font-size: 12px; color: var(--dim); }
.card .s { font-family: var(--mono); color: var(--cyan); letter-spacing: 2px; }
.orb {
  width: 120px; height: 120px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 30%, #4b7f9e, #050c1f 70%);
  box-shadow: 0 0 60px rgba(51,235,255,.45), inset 0 0 20px rgba(51,235,255,.3);
}
.orb::before { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: radial-gradient(circle, #fff, var(--cyan) 45%, transparent 72%); animation: pulse 2.4s ease-in-out infinite; }
.orb::after { content: ""; position: absolute; inset: 34% 6%; border-radius: 50%; border: 2px solid var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: spin 5s linear infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { font-size: 11px; color: var(--dim); letter-spacing: .06em; max-width: 32ch; line-height: 1.5; }
.toggles { display: flex; gap: 10px; }
.chip { background: transparent; border: 1px solid rgba(51,235,255,.5); color: var(--cyan); border-radius: 12px; padding: 8px 14px; font-size: 12px; letter-spacing: .12em; }
.bar-foot { display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.bar-foot #abyss { color: #b48cff; } .bar-foot #score { flex: 1; }
.bar-foot #abyss.pulse { animation: pulse .45s ease-out; display: inline-block; }
.mini { background: transparent; border: 1px solid rgba(255,64,191,.5); color: #ff6fd0; border-radius: 8px; padding: 3px 7px; font: 10px var(--mono); pointer-events: auto; }
.chip[aria-pressed="false"] { color: var(--dim); border-color: rgba(255,255,255,.2); }
#err { position: fixed; inset: auto 16px 16px; z-index: 20; color: var(--magenta); font-family: var(--mono); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .panel, .orb::before, .orb::after { animation: none; } .star { transition: none; } }
</style>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
if (!window.THREE || !window.CANNON) {
  $("err").hidden = false;
  $("err").textContent = "The 3D engine failed to load. Check your connection and reload.";
  return;
}
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = (r, a, b) => a + (b - a) * r();

// ---------- Rules & tuning (mirrors Core/GameConfig.swift, build 3.0) ----------
const RULES = {
  removalY: -1.2, half: 12.5, far: 70, orbLife: 7, orbCleanupY: -24, maxOrbs: 3,
  minResolve: 1.2, maxResolve: 5, quiet: 0.5, failDelay: 1, victoryDelay: 1.1,
  slowScale: 0.3, slowDur: 0.5, slowFrac: 0.3,
  yawLim: 32, minEl: -6, maxEl: 40, defEl: 7, sens: 0.2, cannonZ: 3.4, cannonScale: 0.72,
  sigImpulse: 4, suppCooldown: 0.25, maxSupp: 2, trailSpeed: 6, maxTrails: 8,
};
// Scoring (ScoringConfig): structural displacement drives progress; abyss gives a bonus.
const SCORE = { displaceDist: 0.7, displaceTiltDeg: 30, ptsDisplaced: 100, ptsAbyss: 150, ptsShotLeft: 250 };
// Impact presets (ImpactPreset): dv = peak velocity change at the impact point (m/s),
// fwd/radial/up = direction weights, spin = tumble (rad/s), cap = max dv per block.
const PRESETS = {
  A: { name: "Moderate", dv: 6.5, radius: 2.0, fwd: 0.7, radial: 0.35, up: 0.25, spin: 3, cap: 9, falloff: 1.4 },
  B: { name: "Powerful", dv: 10.5, radius: 2.0, fwd: 0.7, radial: 0.3, up: 0.35, spin: 5, cap: 14, falloff: 1.2 },
  C: { name: "Spectacular", dv: 15, radius: 3.2, fwd: 0.6, radial: 0.5, up: 0.45, spin: 8, cap: 20, falloff: 1.0 },
};
let presetKey = "B";
// DestructionPhysicsConfig
const TUNE = {
  orbMass: 14, orbR: 0.4, launch: 30,
  stdMass: 0.55, heavyMass: 1.8, friction: 0.42, restitution: 0.12, linDamp: 0.02, angDamp: 0.04, stab: 0.92,
  maxV: 26,
  platW: 7.8, platD: 10, platCZ: -0.6, platT: 2.2, fadeDepth: 4, cleanupDepth: 22, settle: 0.35,
  camElev: 5.4, camDist: 4.2, camLookH: 1.2, camLookAhead: 0.6, hfov: 38, shake: 1,
};
// ---------- Levels (mirrors Core/Levels.swift) ----------
// Kinds: standard, beam, column, heavy, wedge, energy. Wedge size = base width, height, depth.
const LEVELS = (() => {
  const g = 0.004;
  const B = () => { const blocks = []; return { blocks, put(k, s, x, z, base, t = true, yaw = 0) { blocks.push({ c: [x, base + g + s[1] / 2, z], s, k, t, yaw }); return base + g + s[1]; } }; };

  // Lunar Gateway (build 3): three separate pieces (left pylon, central gate, right pylon),
  // so one direct hit wrecks one piece and maybe part of a neighbour, never the whole site.
  const l1 = B();
  for (const x of [-2.3, 2.3]) {
    const plinth = l1.put("heavy", [1.2, 0.4, 1.2], x, 0, 0, false); let top = 0;
    for (const z of [-0.3, 0.3]) { const lo = l1.put("column", [0.4, 0.95, 0.4], x, z, plinth); top = l1.put("column", [0.4, 0.95, 0.4], x, z, lo); }
    const cap = l1.put("standard", [1.0, 0.3, 1.0], x, 0, top);
    const cube = l1.put("standard", [0.6, 0.6, 0.6], x, 0, cap);
    l1.put("wedge", [0.7, 0.45, 0.7], x, 0, cube);
  }
  const gBase = l1.put("heavy", [1.5, 0.35, 1.0], 0, 0, 0, false); let gTop = 0;
  for (const x of [-0.5, 0.5]) { const lo = l1.put("column", [0.4, 0.9, 0.4], x, 0, gBase); gTop = l1.put("column", [0.4, 0.9, 0.4], x, 0, lo); }
  const gBeam = l1.put("beam", [1.6, 0.4, 0.8], 0, 0, gTop);
  const coreTop = l1.put("energy", [0.65, 0.65, 0.65], 0, 0, gBeam);
  l1.put("wedge", [0.8, 0.5, 0.7], 0, 0, coreTop);
  const l2 = B(); const ax = -2;
  const aBase = l2.put("heavy", [1.4, 0.5, 1.4], ax, 0, 0, false); let aTop = 0;
  for (const dx of [-0.45, 0.45]) for (const z of [-0.45, 0.45]) aTop = l2.put("column", [0.3, 1.2, 0.3], ax + dx, z, aBase);
  const aCap1 = l2.put("standard", [1.3, 0.3, 1.3], ax, 0, aTop); let aUp = 0;
  for (const x of [-2.45, -1.95]) for (const z of [-0.4, 0.4]) aUp = l2.put("column", [0.3, 1.1, 0.3], x, z, aCap1);
  const aCap2 = l2.put("standard", [0.9, 0.25, 1.1], -2.2, 0, aUp);
  const spire = l2.put("standard", [0.6, 0.6, 0.6], -2.2, 0, aCap2);
  l2.put("wedge", [0.6, 0.6, 0.6], -2.2, 0, spire);
  const bx = 2, bBase = l2.put("heavy", [1.4, 0.5, 1.4], bx, 0, 0, false); let layer = bBase;
  for (let i = 0; i < 2; i++) { let top = 0; for (const dx of [-0.302, 0.302]) for (const z of [-0.302, 0.302]) top = l2.put("heavy", [0.6, 0.6, 0.6], bx + dx, z, layer); layer = top; }
  const bCap = l2.put("standard", [1.3, 0.3, 1.3], bx, 0, layer);
  l2.put("wedge", [0.6, 0.5, 0.6], 2.2, 0, bCap);
  for (const z of [-0.45, 0.45]) l2.put("standard", [0.35, 0.35, 0.35], 2.45, z, bCap);
  const bridge = Math.max(aCap1, bCap); let deck2 = 0;
  for (const z of [-0.27, 0.27]) deck2 = l2.put("beam", [3.4, 0.35, 0.5], 0, z, bridge);
  l2.put("energy", [0.6, 0.6, 0.6], 0, 0, deck2);
  for (const x of [-0.9, 0.9]) l2.put("standard", [0.5, 0.5, 0.5], x, 0, deck2);

  const l3 = B();
  for (const x of [-1.32, 1.32]) for (const z of [-0.82, 0.82]) l3.put("heavy", [2.6, 0.4, 1.6], x, z, 0, false);
  const floor = g + 0.4; let colTop = 0;
  for (const x of [-1.6, 1.6]) for (const z of [-0.6, 0.6]) { const lo = l3.put("column", [0.45, 1.0, 0.45], x, z, floor); colTop = l3.put("column", [0.45, 1.0, 0.45], x, z, lo); }
  let deck3 = 0;
  for (const z of [-0.61, 0.61]) deck3 = l3.put("beam", [3.8, 0.3, 1.2], 0, z, colTop);
  const core3 = l3.put("energy", [0.7, 0.7, 0.7], 0, 0, deck3);
  for (const x of [-0.75, 0.75]) for (const z of [-0.55, 0.55]) { const gt = l3.put("standard", [0.5, 0.5, 0.5], x, z, deck3); l3.put("wedge", [0.5, 0.4, 0.5], x, z, gt, true, Math.PI / 2); }
  const crown = l3.put("standard", [0.9, 0.2, 0.9], 0, 0, core3);
  l3.put("wedge", [0.8, 0.5, 0.8], 0, 0, crown);
  for (const x of [-2.3, 2.3]) for (const z of [-1.25, 1.25]) { const lo = l3.put("standard", [0.55, 0.55, 0.55], x, z, floor); const up = l3.put("standard", [0.55, 0.55, 0.55], x, z, lo); l3.put("wedge", [0.55, 0.45, 0.55], x, z, up); }

  return [
    { id: 1, name: "Lunar Gateway", diff: "Easy", gravity: -9.5, shots: 5, threshold: 0.6, stars: [2, 3, 5], origin: [0, 0, -3.4], pull: 0, el: 5, blocks: l1.blocks },
    { id: 2, name: "Twin Spires", diff: "Moderate", gravity: -10, shots: 5, threshold: 0.7, stars: [2, 3, 5], origin: [0, 0, -3.4], pull: 0.3, el: 8, blocks: l2.blocks },
    { id: 3, name: "Orbital Citadel", diff: "Challenging", gravity: -9, shots: 5, threshold: 0.7, stars: [2, 3, 5], origin: [0, 0, -3.1], pull: 0.9, el: 9, blocks: l3.blocks },
  ];
})();
const starsFor = (shots) => (shots <= level.stars[0] ? 3 : shots <= level.stars[1] ? 2 : 1);

// ---------- Progress (per-browser convenience only) ----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem("cd.progress") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("cd.progress", JSON.stringify(v)); } catch {} },
};
let progress = Object.assign({ unlocked: 0, stars: {}, sound: true }, store.get());

// ---------- Procedural textures ----------
function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function spaceTexture() {
  const [c, g] = canvas(2048, 1024), r = seeded(7);
  const base = g.createLinearGradient(0, 0, 0, 1024);
  base.addColorStop(0, "#010205"); base.addColorStop(0.55, "#050818"); base.addColorStop(1, "#010205");
  g.fillStyle = base; g.fillRect(0, 0, 2048, 1024);
  const neb = ["77,31,158", "20,51,153", "31,97,179"];
  for (let i = 0; i < 48; i++) {
    const x = rnd(r, 200, 1850), y = rnd(r, 280, 620), rad = rnd(r, 90, 300), a = rnd(r, 0.05, 0.13);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${neb[i % 3]},${a})`); gr.addColorStop(1, `rgba(${neb[i % 3]},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }

      <button class="chip" id="snd" aria-pressed="${progress.sound}">SOUND ${progress.sound ? "ON" : "OFF"}</button></div>
      <p class="foot">Web preview of the iOS prototype. Drag to aim, release to fire.</p>
    </div>`);
  on("play", showLevels);
  on("snd", () => { audio.setSound(!progress.sound); showMenu(); });
}
function showLevels() {
  phase = "menu"; showHUD(false);
  const cards = LEVELS.map((l, i) => {
    const open = i <= progress.unlocked, s = progress.stars[l.id] || 0;
    return `<button class="card" id="lv${i}" ${open ? "" : "disabled"}>
      <span class="n">${i + 1}</span>
      <span class="t"><b>${l.name.toUpperCase()}</b><span>${l.diff} · ${l.blocks.filter((b) => b.t).length} targets · ${l.shots} shots</span></span>
      <span class="s">${open ? "★".repeat(s) + "☆".repeat(3 - s) : "LOCKED"}</span></button>`;
  }).join("");
  showOverlay(`<div class="panel bare" style="width:min(380px,100%)"><h2>SELECT LEVEL</h2><div class="levels">${cards}</div><button class="link" id="back">BACK</button></div>`);
  LEVELS.forEach((_, i) => on(`lv${i}`, () => loadLevel(i)));
  on("back", showMenu);
}
function showVictory(stars) {
  const hasNext = levelIndex < LEVELS.length - 1;
  showOverlay(`<div class="panel"><h2>LEVEL COMPLETE</h2>
    <div class="stars">${[0, 1, 2].map((i) => STAR.replace('class="star"', `class="star${i < stars ? " earned" : ""}"`)).join("")}</div>
    <div class="meta">SHOTS USED: ${shotsUsed} · INTO THE VOID: ${removedCount()}</div>
    <div class="meta">SCORE ${scoreNow(true).toLocaleString("en-US")}</div>
    <div class="btns">${hasNext ? '<button class="btn" id="next">NEXT LEVEL</button>' : '<div class="note">All prototype levels cleared!</div>'}
    <button class="btn ghost" id="replay">REPLAY</button><button class="link" id="levels">LEVELS</button></div></div>`);
  overlay.querySelectorAll(".star").forEach((s, i) => setTimeout(() => s.classList.add("show"), 220 * (i + 1)));
  on("next", () => loadLevel(levelIndex + 1));
  on("replay", () => loadLevel(levelIndex));
  on("levels", showLevels);
}
function showFailure(p) {
  const gap = level.threshold - p;
  const msg = gap <= 0.1 ? "So close! One more try." : gap <= 0.3 ? "Good damage. Look for the weak point." : "Try a different angle on the supports.";
  showOverlay(`<div class="panel fail"><h2>LEVEL FAILED</h2>
    <div><div class="big">${Math.round(p * 100)}%</div><div class="small-label">TARGET DESTRUCTION (NEED ${Math.round(level.threshold * 100)}%)</div></div>
    <div class="note">${msg}</div>
    <div class="btns"><button class="btn" id="retry">RETRY</button><button class="link" id="levels">LEVELS</button></div></div>`);
  on("retry", () => loadLevel(levelIndex));
  on("levels", showLevels);
}
function showPause() {
  if (!level || phase === "won" || phase === "failed" || paused) return;
  paused = true; aiming = false; pointerId = null; cannon.charge(false);
  showOverlay(`<div class="panel"><h2>PAUSED</h2><div class="btns">
    <button class="btn" id="resume">RESUME</button><button class="btn ghost" id="restart">RESTART</button>
    <button class="link" id="levels">LEVELS</button></div>
    <div class="toggles"><button class="chip" id="snd" aria-pressed="${progress.sound}">SOUND ${progress.sound ? "ON" : "OFF"}</button></div></div>`);
  on("resume", () => { paused = false; hideOverlay(); updateTrajectory(0.35); });
  on("restart", () => loadLevel(levelIndex));
  on("levels", () => { paused = false; showLevels(); });
  on("snd", () => { audio.setSound(!progress.sound); paused = false; showPause(); });
}
// Debug: cycle impact presets A (moderate) → B (powerful, default) → C (spectacular).
$("presetBtn").addEventListener("click", (e) => { e.stopPropagation(); presetKey = { A: "B", B: "C", C: "A" }[presetKey]; renderHUD(); });
$("pauseBtn").addEventListener("click", () => { audio.play("menu"); showPause(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && level && phase !== "won" && phase !== "failed") showPause(); });

// ---------- Loop ----------
let lastT = performance.now(), acc = 0;
function frame(now) {
  const raw = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!paused) {
    fx.update(raw);
    cannon.update(raw);
    if (level) {
      const ts = fx.timeScale(), dt = raw * ts;
      simTime += dt;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 8) { world.step(FIXED); acc -= FIXED; steps++; }
      if (steps === 8) acc = 0;
      processContacts(); updateBlocks(); updateOrbs(raw); updateGame();
    }
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);

// Test hook for automated checks (no effect on play).
window.__cd = { preset: (k) => { presetKey = k; renderHUD(); },
  // Aim at a world point: yaw toward it, then solve the ballistic elevation (low arc).
  aimAt: (x, y, z) => {
    // The muzzle swings with yaw, so refine the yaw from the moved muzzle a few times.
    let yaw = 0; for (let i = 0; i < 4; i++) { cannon.set(yaw, 0); const m0 = cannon.muzzle(); yaw = Math.atan2(x - m0.x, -(z - m0.z)) / DEG; }
    cannon.set(yaw, 0);
    let best = 0, err = 1e9;
    for (let e = RULES.minEl; e <= RULES.maxEl; e += 0.1) {
      cannon.set(yaw, e); const m = cannon.muzzle(), d = cannon.dir(), v = TUNE.launch, hd = Math.hypot(x - m.x, z - m.z), hv = Math.hypot(d.x, d.z) * v;
      const t = hd / hv, yy = m.y + d.y * v * t + 0.5 * level.gravity * t * t;
      if (Math.abs(yy - y) < err) { err = Math.abs(yy - y); best = e; }
    }
    cannon.set(yaw, best); updateTrajectory(1); return [+yaw.toFixed(1), +best.toFixed(1)];
  },
  standing: () => blocks.filter((b) => b.spec.t && !b.gone && !b.removed && !b.displaced).map((b) => [b.body.position.x, b.body.position.y, b.body.position.z]),
  blocksInfo: () => blocks.filter((b) => b.spec.t).map((b) => ({ k: b.spec.k, c: b.spec.c })),
  // Screen-space bounds of the structure (fractions of the viewport), for framing checks.
  frame: () => {
    let x0 = 1, x1 = 0, y0 = 1, y1 = 0; const v = new THREE.Vector3();
    for (const b of blocks) { b.mesh.geometry.computeBoundingBox(); const bb = b.mesh.geometry.boundingBox;
      for (const cx of [bb.min.x, bb.max.x]) for (const cy of [bb.min.y, bb.max.y]) for (const cz of [bb.min.z, bb.max.z]) {
        v.set(cx, cy, cz).applyMatrix4(b.mesh.matrixWorld).project(camera); const sx = (v.x + 1) / 2, sy = (1 - v.y) / 2;
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy); } }
    const m = cannon.muzzle().project(camera);
    return { top: +y0.toFixed(3), bottom: +y1.toFixed(3), height: +(y1 - y0).toFixed(3), left: +x0.toFixed(3), right: +x1.toFixed(3), muzzleY: +((1 - m.y) / 2).toFixed(3) };
  },
  score: () => ({ structural: progressFrac(), displaced: displacedCount(), abyss: removedCount(), targets: targetCount(), score: scoreNow() }),
  loadLevel, fire, state: () => ({ phase, shotsUsed, progress: progressFrac(), level: level && level.id, blocks: blocks.length, supp: suppThisShot, trails: trailCount, moving: blocks.filter((b) => !b.gone && b.body.velocity.length() > 0.05).length, gone: blocks.filter((b) => b.gone).length }), aim: (y, e) => { cannon.set(y, e); updateTrajectory(1); } };
})();
